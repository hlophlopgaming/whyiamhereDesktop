name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libpulse0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test session logic, process isolation and translations
        run: python -m unittest discover -s tests -v
      - name: Check Russian GUI
        run: python -m tests.gui_smoke
      - name: Check startup
        run: python -m tests.startup_smoke
      - name: Check English GUI and bundled icons
        run: python -m tests.english_smoke
