name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libpulse0
          python -m pip install -r requirements-build.txt
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          python -m tests.gui_smoke
          python -m tests.startup_smoke
          python -m tests.english_smoke
      - name: Build and package
        run: |
          python build_binary.py
          mkdir -p release/why-here
          cp dist/why-here LICENSE THIRD_PARTY.md CHANGELOG.md README.md README.ru.md release/why-here/
          tar -C release -czf why-here-linux-x86_64.tar.gz why-here
          sha256sum why-here-linux-x86_64.tar.gz > why-here-linux-x86_64.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" why-here-linux-x86_64.tar.gz why-here-linux-x86_64.tar.gz.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
